name: '@Stake'
description: >-
  Stake (Stake Technologies, Inc., NMLS #2535498) operates the "Return on Rent"
  cash-back network for renters. Renters earn cash back on their rent payments,
  build credit history through on-time payments, unlock exclusive local deals,
  and access banking services including an FDIC-insured checking account and debit
  card provided through banking partner Midland States Bank. Co-founded by Rowland
  Hobbs and Jimmy Jacobson, the platform reports more than 550,000 homes in its
  network and over $50M in cash back earned by renters, averaging roughly $350 per
  renter annually. Stake is a consumer-facing fintech product; it does not publish
  a public developer API, SDK, or documentation surface at this time. Added to the
  API Evangelist network as a VC-portfolio lead (surfaced under Battery Ventures).
